{% extends "base.html" %}
{% block content %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить услугу - MRAK</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>

<div class="admin-container">
    <h1>Добавить услугу</h1>
    
    <div class="admin-actions">
        <a href="{{ url_for('admin_services') }}" class="btn-secondary">Назад к услугам</a>
    </div>

    <form method="post" class="admin-form">
        <div class="form-group">
            <label for="title_service">Название услуги:</label>
            <input type="text" id="title_service" name="title_service" required>
        </div>
        
        <div class="form-group">
            <label for="price">Цена (руб):</label>
            <input type="number" id="price" name="price" required>
        </div>
        
        <div class="form-group">
            <label for="time">Время выполнения:</label>
            <input type="text" id="time" name="time" placeholder="например: 2 час. 30 мин." required>
        </div>
        
        <div class="form-group">
            <label for="category">Категория:</label>
            <select id="category" name="category" required>
                <option value="">Выберите категорию</option>
                <option value="Тонировка">Тонировка</option>
                <option value="Полировка">Полировка</option>
                <option value="Бронеплёнка">Бронеплёнка</option>
            </select>
        </div>
        
        <button type="submit" class="btn-primary">Добавить услугу</button>
    </form>
</div>
{% endblock %}
